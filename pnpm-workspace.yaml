packages:
  - 'apps/*'

# New dependencies are recorded as exact versions, not caret ranges.
saveExact: true

# Nothing in this tree needs a lifecycle/build step: better-sqlite3@13 ships
# N-API prebuilds (no node-gyp), and esbuild resolves its platform binary
# through optionalDependencies.
ignoredBuiltDependencies:
  - better-sqlite3
  - esbuild

onlyBuiltDependencies: []
